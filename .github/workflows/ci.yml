name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
     branches:
      - main
      - master

env:
  FOUNDRY_PROFILE: ci


jobs:
  run-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '22.10.0'

      - name: Ensure Yarn is installed
        run: npm install --global yarn

      - name: Install
        run: make install

      - name: Run formatters
        run: make fmt

      - name: Run linters
        run: make lint

      - name: Run tests
        run: make tests
