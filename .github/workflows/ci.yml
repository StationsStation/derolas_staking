name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
     branches:
      - main
      - master

env:
  FOUNDRY_PROFILE: ci


jobs:
  run-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      #- name: Check gas snapshots
      #  run: forge snapshot --check

      - name: Run tests
        run: forge test
